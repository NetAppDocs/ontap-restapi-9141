root_overview:
  ai-gen:
    keywords: ontap rest documentation, netapp ontap automation, http methods ontap,
      ontap rest error codes, ontap hal support
    lead: The ONTAP REST API provides a comprehensive framework for interacting with
      ONTAP systems using RESTful principles. This documentation introduces a wide
      array of API calls, detailing their usage and implementation, to help you effectively
      manage resources such as clusters, SVMs, and storage within your ONTAP environment.
      By exploring these endpoints, you can gain insights into performing operations
      and retrieving information programmatically, enhancing automation and integration
      capabilities.
categories:
- id: cloud
  title: ONTAP REST API cloud endpoints
  permalink: cloud_endpoints.html
  ai-gen:
    keywords: cloud targets,object storage,cloud management,storage targets,ontap
      cloud
    lead: Manage cloud object storage targets to optimize and secure your cloud storage
      environment. Use these endpoints to configure and monitor storage resources
      efficiently.
- id: cluster
  title: ONTAP REST API cluster endpoints
  permalink: cluster_endpoints.html
  ai-gen:
    keywords: cluster creation,add nodes,cluster configuration,update software,manage
      nodes
    lead: Utilize cluster endpoints to create and configure your ONTAP cluster, manage
      nodes, and monitor jobs and software updates. These APIs support workflows like
      adding nodes and updating configuration data to optimize cluster performance.
      Use specific endpoints before cluster creation to initiate and track setup.
- id: networking
  title: ONTAP REST API networking endpoints
  permalink: networking_endpoints.html
  ai-gen:
    keywords: ipspaces, broadcast domains, fibre channel, ethernet ports, service
      policies, ip interfaces
    lead: Explore networking endpoints to report and manage networking configurations
      such as IPspaces, interfaces, routes, ports, service policies, and broadcast
      domains within your ONTAP environment. These endpoints help ensure efficient
      network communication and organization across administratively separate network
      domains.
- id: svm
  title: ONTAP REST API svm endpoints
  permalink: svm_endpoints.html
  ai-gen:
    keywords: storage virtual machine,nfs configuration,cifs configuration,network
      services,data access,fibre channel
    lead: Utilize the Storage Virtual Machine (SVM) endpoints to manage SVMs, configure
      protocols, and define export policies within your ONTAP environment. These endpoints
      facilitate secure data access and isolation, allowing independent administration
      and support for both NAS and SAN clients.
- id: name-services
  title: ONTAP REST API name-services endpoints
  permalink: name-services_endpoints.html
  ai-gen:
    keywords: name services,ldap configuration,dns resolution,nis servers,ns-switch
    lead: Access and configure name-services endpoints to authenticate users and resolve
      hostnames within your ONTAP environment. Whether integrating with NIS or LDAP
      servers or configuring DNS and ns-switch settings, these endpoints facilitate
      user credential mapping and network information retrieval.
- id: san
  title: ONTAP REST API SAN endpoints
  permalink: san_endpoints.html
  ai-gen:
    keywords: fibre channel,iscsi sessions,wwpn aliases,lun maps,initiator groups,vvol
      bindings
    lead: The SAN endpoints provide the tools necessary to configure, provision, and
      manage SAN-related objects. Use these endpoints to effectively administer storage
      area network configurations and maintain optimal storage operations within your
      environment.
- id: nvme
  title: ONTAP REST API NVMe endpoints
  permalink: nvme_endpoints.html
  ai-gen:
    keywords: nvme services,fibre channel logins,nvme interfaces,nvme controllers,nvme
      subsystem maps,nvme namespaces
    lead: Explore the NVMe endpoints to configure, provision, and manage NVMe-related
      objects within your ONTAP environment. Use these endpoints to handle NVMe and
      NVMe-oF extensions, providing a unified approach for storage configurations
      and host connections.
- id: application
  title: ONTAP REST API application endpoints
  permalink: application_endpoints.html
  ai-gen:
    keywords: application provisioning,storage management,netapp best practices,application
      templates,smart containers
    lead: The ONTAP application APIs streamline storage management by utilizing application-specific
      terminology to provision and manage storage objects. These endpoints enable
      efficient storage provisioning and protocol access for applications while adhering
      to NetApp best practices. You can manage ONTAP objects as a cohesive group using
      these APIs, with templates available for various database and virtualization
      applications.
- id: support
  title: ONTAP REST API support endpoints
  permalink: support_endpoints.html
  ai-gen:
    keywords: configuration backups,autosupport settings,event handling,email parameters,event
      management system
    lead: Utilize the support endpoints to manage configuration backups, autosupport
      settings, and handle events effectively. These APIs help ensure your system's
      configuration remains protected and that events are reported accurately for
      timely troubleshooting and support.
- id: security
  title: ONTAP REST API security endpoints
  permalink: security_endpoints.html
  ai-gen:
    keywords: security settings,cluster security,svm security,saml configuration,multi-factor
      authentication
    lead: Configure security settings for clusters and SVMs using ONTAP security APIs
      to safeguard your environment. Implement SAML 2.0 authentication for enhanced
      security with third-party identity providers.
- id: storage
  title: ONTAP REST API storage endpoints
  permalink: storage_endpoints.html
  ai-gen:
    keywords: storage management,physical storage,logical storage,storage efficiency,snapshots
    lead: Manage physical and logical storage using ONTAP storage APIs. This includes
      handling aggregates, volumes, LUNs, qtrees, snapshots, quotas, and storage efficiency.
- id: snapmirror
  title: ONTAP REST API snapmirror endpoints
  permalink: snapmirror_endpoints.html
  ai-gen:
    keywords: snapmirror technology,snapmirror backup,snapmirror restore,async relationship,sync
      relationship,disaster recovery
    lead: Utilize SnapMirror endpoints to create and manage async and sync backup
      relationships, ensuring efficient and scalable data protection. These endpoints
      enable you to configure policies, establish relationships, and manage data transfers
      to maintain up-to-date replicas and facilitate data restoration.
- id: ndmp
  title: ONTAP REST API ndmp endpoints
  permalink: ndmp_endpoints.html
  ai-gen:
    keywords: ndmp backup,network data management,ndmp nodes,data protection,ndmp
      sessions,tape storage
    lead: Utilize NDMP endpoints to manage network-based backup operations for NAS
      data, enhancing speed and efficiency through direct data paths to tape storage.
      Implement these endpoints to optimize backup performance and support seamless
      operations, with compatibility for SVM aware NDMP backups starting from ONTAP
      8.2.
- id: snaplock
  title: ONTAP REST API snaplock endpoints
  permalink: snaplock_endpoints.html
  ai-gen:
    keywords: worm storage,snaplock retention,privileged delete,legal hold,file fingerprint
    lead: Utilize SnapLock endpoints to administer the storage and management of read-only
      WORM data. These APIs support strict regulatory compliance by maintaining data
      in a non-rewritable state, ensuring data integrity even in environments where
      the storage administrator is considered untrusted.
- id: nas
  title: ONTAP REST API NAS endpoints
  permalink: nas_endpoints.html
  ai-gen:
    keywords: nfs server,nfs configuration,export policy,export rule,kerberos authentication,kerberos
      realm
    lead: Use NAS endpoints to create and manage NFS settings and export policies
      for a storage virtual machine (SVM). These APIs facilitate tasks like configuring
      NFS servers and defining access rules based on IP addresses and authentication
      types. Additionally, leverage Kerberos APIs to set up secure authentication
      realms and manage interface configurations for enhanced security within client/server
      environments.
subcategories:
